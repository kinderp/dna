name: Travel Domain CI

on:
  pull_request:
    branches: [main]
    paths:
      - ".gitmodules"
      - "domains/travel"
      - "tools/dna"
      - ".github/workflows/travel-ci.yml"
  push:
    branches: [main]
    paths:
      - ".gitmodules"
      - "domains/travel"
      - "tools/dna"
      - ".github/workflows/travel-ci.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  travel:
    name: TDNA checks without emulator
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out exact head and Travel source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive
      - name: Set up Java 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Configure Gradle cache
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
        with:
          cache-provider: basic
          add-job-summary: on-failure
      - name: Install stable Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable
      - name: Run Travel verification
        run: sh tools/dna check-travel
