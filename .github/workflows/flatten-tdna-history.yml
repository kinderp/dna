name: One-shot TDNA history flattening

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: tdna-history-flattening
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  flatten:
    if: >-
      github.event.pull_request.head.ref == 'agent/flatten-travel-history' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out the migration branch with complete history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: agent/flatten-travel-history
          fetch-depth: 0
          submodules: recursive

      - name: Decide whether the one-shot migration still needs to run
        id: gate
        shell: bash
        run: |
          if [ -f docs/migration/.tdna-flattened ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "The migration marker already exists; skipping the one-shot job."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure migration commit identity
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "DNA migration automation"
          git config user.email "actions@users.noreply.github.com"

      - name: Set up Java 21
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Verify hosted Android SDK 37
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ANDROID_HOME:-}"
          platform_jar=$(find "${ANDROID_HOME}/platforms" -maxdepth 2 -type f -path '*/android-37*/android.jar' | sort | sed -n '1p')
          build_tools=$(find "${ANDROID_HOME}/build-tools" -maxdepth 1 -type d -name '36.0.0' | sort | sed -n '1p')
          test -n "$platform_jar"
          test -n "$build_tools"
          printf 'ANDROID_HOME=%s\nplatform=%s\nbuild-tools=%s\n' "$ANDROID_HOME" "$platform_jar" "$build_tools"

      - name: Configure Gradle cache
        if: steps.gate.outputs.run == 'true'
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
        with:
          cache-provider: basic
          add-job-summary: on-failure

      - name: Install stable Rust toolchain
        if: steps.gate.outputs.run == 'true'
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable

      - name: Install DNA schema tooling
        if: steps.gate.outputs.run == 'true'
        run: python3 -m pip install -r requirements-dev.txt

      - name: Remove the submodule bridge and import TDNA history
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/migration

          # actions/checkout stores an auth header scoped to the DNA repository.
          # Remove it before anonymously fetching the public TDNA repository.
          git config --local --unset-all http.https://github.com/.extraheader || true

          # `git submodule deinit` stages a change to .gitmodules. The bridge
          # removal must therefore force-delete that already-staged file.
          sed -i 's/run("git", "rm", ".gitmodules")/run("git", "rm", "-f", ".gitmodules")/' tools/migrations/flatten_tdna.py

          set +e
          python3 tools/migrations/flatten_tdna.py 2>&1 | tee build/migration/flatten.log
          status=${PIPESTATUS[0]}
          git status --short > build/migration/status-after-flatten.txt
          git log --graph --oneline --decorate --all -n 200 > build/migration/history-after-flatten.txt
          set -e
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi

          mkdir -p docs/migration
          printf '%s\n' '85c73ab78dd56506c5595673098adf514765de9c' > docs/migration/.tdna-flattened

      - name: Validate root contracts, reference implementation and Actions policy
        if: steps.gate.outputs.run == 'true'
        run: |
          sh tools/dna check-core-contracts
          sh tools/dna check-core-reference
          sh tools/dna check-ci-actions

      - name: Validate imported Travel history and complete non-emulator suite
        if: steps.gate.outputs.run == 'true'
        run: sh tools/dna check-travel

      - name: Enable KVM access
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Execute isolated Android emulator evidence
        if: steps.gate.outputs.run == 'true'
        env:
          TDNA_SUBSTANTIVE_SHA: ${{ github.event.pull_request.head.sha }}
          TDNA_EMULATOR_API_LEVEL: "35"
          TDNA_EMULATOR_ABI: x86_64
          TDNA_EMULATOR_BOOT_TIMEOUT_SECONDS: "360"
        run: sh tools/dna check-travel-emulator

      - name: Create a recovery bundle
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          mkdir -p build/migration
          git bundle create build/migration/tdna-flattening.bundle --all
          git log --graph --oneline --decorate --all -n 200 > build/migration/history.txt
          git status --short > build/migration/status.txt

      - name: Upload bounded migration evidence
        if: ${{ always() && steps.gate.outputs.run == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tdna-history-flattening-evidence
          if-no-files-found: warn
          retention-days: 14
          path: |
            build/migration/**
            domains/travel/build/android-emulator/*.json
            domains/travel/build/android-emulator/*.txt
            domains/travel/build/android-emulator/*.log
            domains/travel/build/android-emulator/*.png
            domains/travel/apps/android/build/reports/androidTests/connected/**
            domains/travel/apps/android/build/outputs/androidTest-results/connected/**

      - name: Remove one-shot migration machinery and publish the candidate branch
        if: steps.gate.outputs.run == 'true'
        shell: bash
        env:
          GH_PUSH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git rm .github/workflows/flatten-tdna-history.yml
          git rm tools/migrations/flatten_tdna.py
          rmdir tools/migrations 2>/dev/null || true
          git add -A
          git commit -m "Complete TDNA history flattening candidate"
          git push "https://x-access-token:${GH_PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:agent/flatten-travel-history
