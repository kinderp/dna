name: Foundation CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  foundation:
    name: Docs, Java, Rust, Kotlin and contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.1"
          cache-provider: basic
          add-job-summary: on-failure

      - name: Generate reviewed Gradle Wrapper bootstrap
        shell: bash
        run: |
          set -euo pipefail
          gradle wrapper \
            --gradle-version 9.5.1 \
            --distribution-type bin \
            --gradle-distribution-sha256-sum bafc141b619ad6350fd975fc903156dd5c151998cc8b058e8c1044ab5f7b031f
          actual=$(sha256sum gradle/wrapper/gradle-wrapper.jar | awk '{print $1}')
          expected=497c8c2a7e5031f6aa847f88104aa80a93532ec32ee17bdb8d1d2f67a194a9c7
          test "$actual" = "$expected"
          grep -F 'distributionSha256Sum=bafc141b619ad6350fd975fc903156dd5c151998cc8b058e8c1044ab5f7b031f' \
            gradle/wrapper/gradle-wrapper.properties

      - name: Commit verified wrapper to this internal PR branch
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        env:
          PR_HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties
          if git diff --cached --quiet; then
            echo "Verified wrapper is already committed."
            exit 0
          fi
          git commit -m "build: commit verified Gradle 9.5.1 Wrapper"
          git push origin "HEAD:${PR_HEAD_REF}"

      - name: Upload reviewed Gradle Wrapper bootstrap
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-wrapper-bootstrap
          if-no-files-found: error
          retention-days: 1
          path: |
            gradlew
            gradlew.bat
            gradle/wrapper/gradle-wrapper.jar
            gradle/wrapper/gradle-wrapper.properties

      - name: Install stable Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable

      - name: Show toolchain
        run: sh tools/tdna doctor

      - name: Check documentation
        shell: bash
        run: |
          mkdir -p build
          set -o pipefail
          sh tools/tdna check-docs 2>&1 | tee build/docs-check.log

      - name: Check shared architecture boundaries
        shell: bash
        run: |
          mkdir -p build
          set -o pipefail
          sh tools/tdna check-architecture 2>&1 | tee build/architecture-check.log

      - name: Check Java reference routing
        run: sh tools/tdna check-java

      - name: Check Rust reference routing
        shell: bash
        run: |
          mkdir -p build
          set -o pipefail
          sh tools/tdna check-rust 2>&1 | tee build/rust-check.log

      - name: Check Java and Rust contract
        run: sh tools/tdna check-contract

      - name: Check Kotlin Multiplatform contracts
        shell: bash
        run: |
          mkdir -p build
          set -o pipefail
          sh tools/tdna check-kotlin 2>&1 | tee build/kotlin-check.log

      - name: Upload Kotlin Lab and benchmark observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foundation-kotlin-observations
          if-no-files-found: ignore
          retention-days: 14
          path: |
            build/kotlin/location-replay-lab.json
            build/kotlin/location-replay-benchmark.json
            build/kotlin/route-progress-lab.json
            build/kotlin/route-progress-benchmark.json
            build/kotlin/map-matching-lab.json
            build/kotlin/map-matching-benchmark.json
            build/kotlin/missed-exit-lab.json
            build/kotlin/off-route-benchmark.json

      - name: Upload diagnostic output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: foundation-diagnostics
          if-no-files-found: ignore
          path: build/
